name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Zig 0.16.0
        run: |
          curl --fail --location --silent --show-error \
            https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz --output "$RUNNER_TEMP/zig.tar.xz"
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Zig version
        run: test "$(zig version)" = 0.16.0

      - name: Format
        run: zig fmt --check src tests build.zig tools/build.zig tools/zig

      - name: Tests
        run: |
          zig build test --summary all
          zig build test -Doptimize=ReleaseSafe --summary all
          zig build test -Doptimize=ReleaseFast --summary all
          zig build test -Dkernel-backend=portable --summary all
          zig build test -Dcpu=baseline --summary all

      - name: Cross-target compiles
        run: |
          for target in x86_64-linux aarch64-linux x86_64-macos aarch64-macos; do
            zig build -Dtarget="$target" -Doptimize=ReleaseFast
          done

      - name: Shell scripts
        run: shellcheck tools/*.sh
