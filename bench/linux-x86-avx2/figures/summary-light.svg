<text x="28.0" y="38.0" font-size="20" fill="#0b0b0b" text-anchor="start" font-weight="650" >zipir against the fastest peer on every path</text>
<text x="28.0" y="62.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >Peer time divided by zipir time: geometric mean over the small and medium corpus files, whiskers across files. Left of 1 the peer is faster.</text>
<text x="28.0" y="81.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >AMD Ryzen 9 3950X (Zen 2, AVX2), Linux, one thread per process, matched interleaved rounds (zipir compression re-timed separately). zipir 1b9b531.</text>
