<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 732" width="1180" height="732" role="img" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">
<title>zipir against the fastest peer, by path</title><desc>For each format, operation, and level: the fastest single-threaded peer relative to zipir, and for compression the fastest peer whose output is no larger than zipir's.</desc>
<rect width="1180" height="732" rx="12" fill="#1a1a19"/>
<text x="28.0" y="38.0" font-size="20" fill="#ffffff" text-anchor="start" font-weight="650" >zipir against the fastest peer on every path</text>
<text x="28.0" y="62.0" font-size="13" fill="#c3c2b7" text-anchor="start" font-weight="400" >Peer time divided by zipir time: geometric mean over the small and medium corpus files, whiskers across files. Left of 1 the peer is faster.</text>
<text x="28.0" y="81.0" font-size="13" fill="#c3c2b7" text-anchor="start" font-weight="400" >AMD Ryzen 9 3950X (Zen 2, AVX2), Linux, one thread per process, matched interleaved rounds (zipir compression and decompression re-timed separately). zipir fca02df.</text>
