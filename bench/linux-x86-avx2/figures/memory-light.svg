<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 398" width="940" height="398" role="img" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">
<title>Peak memory by tool</title><desc>Peak resident set size of the whole process, small and medium files.</desc>
<rect width="940" height="398" rx="12" fill="#fcfcfb"/>
<text x="28.0" y="38.0" font-size="20" fill="#0b0b0b" text-anchor="start" font-weight="650" >Peak memory of the whole process</text>
<text x="28.0" y="62.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >Median peak RSS per run; the line spans every file and level. Filled: decompression. Hollow: compression. Lower is better.</text>
<line x1="190.0" y1="104.0" x2="190.0" y2="314.0" stroke="#e1e0d9" stroke-width="1" />
<text x="190.0" y="332.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400" >0</text>
<line x1="283.3" y1="104.0" x2="283.3" y2="314.0" stroke="#e1e0d9" stroke-width="1" />
<text x="283.3" y="332.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400" >1</text>
<line x1="376.7" y1="104.0" x2="376.7" y2="314.0" stroke="#e1e0d9" stroke-width="1" />
<text x="376.7" y="332.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400" >2</text>
<line x1="470.0" y1="104.0" x2="470.0" y2="314.0" stroke="#e1e0d9" stroke-width="1" />
<text x="470.0" y="332.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400" >3</text>
<line x1="563.3" y1="104.0" x2="563.3" y2="314.0" stroke="#e1e0d9" stroke-width="1" />
<text x="563.3" y="332.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400" >4</text>
<line x1="656.7" y1="104.0" x2="656.7" y2="314.0" stroke="#e1e0d9" stroke-width="1" />
<text x="656.7" y="332.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400" >5</text>
<line x1="750.0" y1="104.0" x2="750.0" y2="314.0" stroke="#e1e0d9" stroke-width="1" />
<text x="750.0" y="332.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400" >6</text>
<text x="470.0" y="352.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="400" >MiB</text>
<text x="178.0" y="131.0" font-size="13" fill="#52514e" text-anchor="end" font-weight="400" >zipir</text>
<line x1="242.1" y1="127.0" x2="250.5" y2="127.0" stroke="#e08e0b" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
<circle cx="248.7" cy="127.0" r="5.5" fill="#fcfcfb" stroke="#e08e0b" stroke-width="2.2"><title>compression median 0.63 MiB</title></circle>
<circle cx="247.2" cy="127.0" r="5.5" fill="#e08e0b" stroke="#fcfcfb" stroke-width="2"><title>decompression median 0.61 MiB</title></circle>
<text x="764.0" y="131.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400" >0.56 to 0.65 MiB</text>
<text x="178.0" y="165.0" font-size="13" fill="#52514e" text-anchor="end" font-weight="400" >zlib-ng</text>
<line x1="340.9" y1="161.0" x2="386.9" y2="161.0" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
<rect x="362.2" y="156.1" width="9.9" height="9.9" rx="1.5" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2.2"><title>compression median 1.90 MiB</title></rect>
<rect x="339.6" y="156.1" width="9.9" height="9.9" rx="1.5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"><title>decompression median 1.66 MiB</title></rect>
<text x="764.0" y="165.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400" >1.6 to 2.1 MiB</text>
<text x="178.0" y="199.0" font-size="13" fill="#52514e" text-anchor="end" font-weight="400" >ISA-L igzip</text>
<line x1="460.5" y1="195.0" x2="530.9" y2="195.0" stroke="#1baf7a" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
<path d="M505.7,187.4 L512.6,200.5 L498.9,200.5 Z" fill="#fcfcfb" stroke="#1baf7a" stroke-width="2.2" stroke-linejoin="round"><title>compression median 3.38 MiB</title></path>
<path d="M530.2,187.4 L537.0,200.5 L523.3,200.5 Z" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2" stroke-linejoin="round"><title>decompression median 3.64 MiB</title></path>
<text x="764.0" y="199.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400" >2.9 to 3.7 MiB</text>
<text x="178.0" y="233.0" font-size="13" fill="#52514e" text-anchor="end" font-weight="400" >Zig std</text>
<line x1="247.2" y1="229.0" x2="250.5" y2="229.0" stroke="#898781" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
<path d="M250.5,221.8 L257.7,229.0 L250.5,236.2 L243.4,229.0 Z" fill="#fcfcfb" stroke="#898781" stroke-width="2.2" stroke-linejoin="round"><title>compression median 0.65 MiB</title></path>
<path d="M247.4,221.8 L254.6,229.0 L247.4,236.2 L240.3,229.0 Z" fill="#898781" stroke="#fcfcfb" stroke-width="2" stroke-linejoin="round"><title>decompression median 0.62 MiB</title></path>
<text x="764.0" y="233.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400" >0.61 to 0.65 MiB</text>
<text x="178.0" y="267.0" font-size="13" fill="#52514e" text-anchor="end" font-weight="400" >bgzip + libdeflate</text>
<line x1="417.1" y1="263.0" x2="656.7" y2="263.0" stroke="#4a3aa7" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
<rect x="461.0" y="258.1" width="9.9" height="9.9" rx="1.5" fill="#fcfcfb" stroke="#4a3aa7" stroke-width="2.2"><title>compression median 2.96 MiB</title></rect>
<rect x="430.4" y="258.1" width="9.9" height="9.9" rx="1.5" fill="#4a3aa7" stroke="#fcfcfb" stroke-width="2"><title>decompression median 2.63 MiB</title></rect>
<text x="764.0" y="267.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400" >2.4 to 5.0 MiB</text>
<text x="178.0" y="301.0" font-size="13" fill="#52514e" text-anchor="end" font-weight="400" >bgzip + zlib-ng</text>
<line x1="412.0" y1="297.0" x2="468.2" y2="297.0" stroke="#e87ba4" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
<path d="M462.7,289.4 L469.6,302.5 L455.8,302.5 Z" fill="#fcfcfb" stroke="#e87ba4" stroke-width="2.2" stroke-linejoin="round"><title>compression median 2.92 MiB</title></path>
<path d="M418.2,289.4 L425.1,302.5 L411.4,302.5 Z" fill="#e87ba4" stroke="#fcfcfb" stroke-width="2" stroke-linejoin="round"><title>decompression median 2.45 MiB</title></path>
<text x="764.0" y="301.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400" >2.4 to 3.0 MiB</text>
<text x="28.0" y="378.0" font-size="12" fill="#898781" text-anchor="start" font-weight="400" >Whole-process RSS includes each program's runtime and libc, not only codec state. zipir and the Zig std adapter are static Zig programs; the others load libc.</text>
</svg>
